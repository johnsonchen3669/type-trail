name: Publish Day 3 Quiz

on:
  schedule:
    # 2026-09-16 04:00 UTC = 12:00 Asia/Taipei. Re-fires yearly but is a
    # no-op once Day 3 is already published.
    - cron: '0 4 16 9 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-day-3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Flip Day 3 quiz status to published
        run: |
          sed -z "s/status: 'coming-soon',\n    day: 3,/status: 'published',\n    day: 3,/" \
            src/app/quiz/quiz-catalog.ts > quiz-catalog.tmp
          mv quiz-catalog.tmp src/app/quiz/quiz-catalog.ts

      - name: Commit and push publish change
        id: commit
        run: |
          if git diff --quiet src/app/quiz/quiz-catalog.ts; then
            echo "Day 3 is already published; nothing to do."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/app/quiz/quiz-catalog.ts
            git commit -m "feat: publish day 3 quiz"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows
      # (GitHub's anti-recursion rule), so re-trigger the deploy explicitly.
      - name: Trigger Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main